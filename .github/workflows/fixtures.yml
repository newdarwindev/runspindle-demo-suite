name: Fixture verification and presentation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify exact submodule checkout
        run: |
          test -z "$(git submodule status --recursive | grep -E '^[+-U]' || true)"
          git submodule foreach --recursive 'test -z "$(git status --porcelain)"'
      - name: Install locked browser dependency
        run: npm ci
      - name: Install pinned browser
        run: npx playwright install --with-deps chromium
      - name: Install presentation renderer
        run: sudo apt-get install -y ffmpeg
      - name: Contract tests
        run: python3 tools/demo.py test
      - name: Start controlled fixture apps
        run: |
          python3 tools/demo.py up > /tmp/fixture-server.log 2>&1 &
          for attempt in $(seq 1 30); do curl --fail http://localhost:4300/health && break; sleep 1; done
      - name: Seven normal recordings
        run: python3 tools/demo.py record-all
      - name: Fault and fresh-process recovery recordings
        if: always()
        run: python3 tools/demo.py fault-matrix
      - name: Record locked-version evaluation and rollback
        if: always()
        run: node tools/evaluation-browser.cjs
      - name: Assemble package with all outcomes
        if: always()
        run: python3 tools/presentation.py --reel
      - name: Open gallery and play recorded clips
        if: always()
        run: node tools/verify-gallery.cjs
      - name: Upload presentation and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runspindle-presentation-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
  publish-presentation:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download verified presentation artifact
        run: gh run download "$GITHUB_RUN_ID" --name "runspindle-presentation-$GITHUB_SHA" --dir package
      - name: Publish durable fixture preview
        run: |
          tag="demo-${GITHUB_SHA:0:12}"
          gh release create "$tag" package/presentation.zip package/gallery-verification.json \
            --target "$GITHUB_SHA" --prerelease \
            --title "Verified fixture presentation ${GITHUB_SHA:0:7}" \
            --notes "Actual browser fixture recordings, fault recovery, evaluation approval/rollback, gallery playback and independent evidence. Download presentation.zip, extract and open index.html. Synthetic data and conceptual interface only; upstream Runspindle does not execute and comparative savings are untested. Check repository STATUS.md for child-publication limits. Verified CI: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
