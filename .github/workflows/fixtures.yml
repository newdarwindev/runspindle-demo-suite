name: Fixture verification and presentation
on:
  push:
    branches: [main, 'ci/*']
permissions:
  contents: read
concurrency:
  group: runspindle-demo-local-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ["${{ format('runspindle-strix-direct-{0}-{1}-verify', github.run_id, github.run_attempt) }}"]
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify exact submodule checkout
        run: |
          test -z "$(git submodule status --recursive | grep -E '^[+-U]' || true)"
          git submodule foreach --recursive 'test -z "$(git status --porcelain)"'
      - name: Check provisioned local-runner tools
        run: |
          for tool in python3 node npm git ffmpeg ffprobe; do command -v "$tool" || exit 1; done
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          echo "Using the provisioned disposable local runner; no host or image changes."
          echo "PLAYWRIGHT_BROWSERS_PATH=/home/runner/preparation/demo/browsers" >> "$GITHUB_ENV"
          echo "npm_config_cache=/home/runner/preparation/demo/npm" >> "$GITHUB_ENV"
      - name: Install locked browser dependency
        run: npm ci --offline --no-audit --no-fund
      - name: Contract tests
        run: python3 tools/demo.py test
      - name: Distinct branding desktop and mobile gate
        run: node tools/check-branding.cjs
      - name: Start controlled fixture apps
        run: |
          python3 tools/demo.py up > "$RUNNER_TEMP/fixture-server.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/fixture-server.pid"
          for attempt in $(seq 1 30); do curl --fail http://localhost:4300/health && break; sleep 1; done
          curl --fail http://localhost:4300/health
      - name: Fourteen live workspace visual and interaction checks
        run: |
          for case in $(python3 -c 'import json; print(" ".join(json.load(open("contracts/cases.json"))))'); do python3 tools/demo.py reset "$case"; done
          node tools/check-workspaces.cjs
      - name: Manual handoff browser contract
        run: |
          python3 tools/demo.py reset bookkeeper-deposit --fault expired
          node tools/check-manual-handoff.cjs
      - name: Seven normal recordings
        run: python3 tools/demo.py record-all
      - name: Fault and fresh-process recovery recordings
        if: always()
        run: python3 tools/demo.py fault-matrix
      - name: Record locked-version evaluation and rollback
        if: always()
        run: node tools/evaluation-browser.cjs
      - name: Assemble package with all outcomes
        if: always()
        run: python3 tools/presentation.py --reel
      - name: Open gallery and play recorded clips
        if: always()
        run: node tools/verify-gallery.cjs
      - name: Stop this job's fixture server
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/fixture-server.pid"; then
            pid=$(cat "$RUNNER_TEMP/fixture-server.pid")
            if test -r "/proc/$pid/cmdline" && tr "\0" " " < "/proc/$pid/cmdline" | grep -Fq "tools/demo.py up"; then kill "$pid"; fi
          fi
      - name: Upload presentation and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runspindle-presentation-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
  publish-presentation:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ["${{ format('runspindle-strix-direct-{0}-{1}-publish-presentation', github.run_id, github.run_attempt) }}"]
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check provisioned release tool
        run: command -v gh
      - name: Download verified presentation artifact
        run: gh run download "$GITHUB_RUN_ID" --name "runspindle-presentation-$GITHUB_SHA" --dir package
      - name: Publish durable fixture preview
        run: |
          tag="demo-${GITHUB_SHA:0:12}"
          assets=(package/workspaces/workspace-tour.mp4 package/workspaces/verification.json package/presentation.zip package/gallery-verification.json package/gallery-verified.png)
          if test -f package/presentation-package/combined-reel.mp4; then assets+=(package/presentation-package/combined-reel.mp4); fi
          if test -f package/presentation-package/combined-reel.webm; then assets+=(package/presentation-package/combined-reel.webm); fi
          gh release create "$tag" "${assets[@]}" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Verified fixture presentation ${GITHUB_SHA:0:7}" \
            --notes "Actual browser fixture recordings, fault recovery, evaluation approval/rollback, gallery playback and independent evidence. Download presentation.zip, extract and open index.html. Synthetic data and conceptual interface only; upstream Runspindle does not execute and comparative savings are untested. See repository docs/STATUS.md for verification scope. Verified CI: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
